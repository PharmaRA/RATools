<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="pdf-illustration-title">
  <title id="pdf-illustration-title">RATools for PDF — 批量定稿场景示意图</title>

  <rect width="480" height="360" fill="#f8f9fa"/>

  <!-- back stack -->
  <g opacity="0.6">
    <rect x="76" y="74" width="240" height="220" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  </g>
  <g opacity="0.85">
    <rect x="68" y="66" width="240" height="220" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  </g>

  <!-- main page -->
  <rect x="60" y="58" width="240" height="220" rx="8" fill="#ffffff" stroke="#cfd4d9"/>

  <!-- PDF tag corner -->
  <g>
    <rect x="60" y="58" width="44" height="22" rx="0" fill="#c0392b"/>
    <text x="82" y="74" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PDF</text>
  </g>

  <!-- header line -->
  <rect x="80" y="100" width="180" height="8" rx="2" fill="#212529"/>
  <rect x="80" y="116" width="140" height="6" rx="2" fill="#adb5bd"/>

  <!-- bookmark arrows on left edge -->
  <g transform="translate(72, 138)">
    <rect x="0" y="0" width="6" height="14" fill="#1a4d8c"/>
    <rect x="0" y="22" width="6" height="14" fill="#1a4d8c"/>
    <rect x="0" y="44" width="6" height="14" fill="#1a4d8c" opacity="0.6"/>
  </g>

  <!-- body lines -->
  <rect x="92" y="142" width="200" height="5" rx="2" fill="#dee2e6"/>
  <rect x="92" y="154" width="180" height="5" rx="2" fill="#dee2e6"/>
  <rect x="92" y="166" width="208" height="5" rx="2" fill="#dee2e6"/>
  <!-- hyperlink -->
  <rect x="92" y="178" width="84" height="5" rx="2" fill="#1a4d8c"/>
  <rect x="180" y="178" width="120" height="5" rx="2" fill="#dee2e6"/>
  <rect x="92" y="190" width="160" height="5" rx="2" fill="#dee2e6"/>

  <rect x="92" y="208" width="200" height="5" rx="2" fill="#dee2e6"/>
  <rect x="92" y="220" width="184" height="5" rx="2" fill="#dee2e6"/>
  <!-- another hyperlink with border -->
  <rect x="92" y="232" width="100" height="9" rx="1" fill="none" stroke="#1a4d8c" stroke-dasharray="2 2"/>
  <rect x="96" y="234" width="92" height="5" rx="2" fill="#1a4d8c"/>

  <!-- bookmark side panel -->
  <rect x="328" y="58" width="92" height="220" rx="8" fill="#ffffff" stroke="#cfd4d9"/>
  <text x="340" y="80" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#212529">Bookmarks</text>

  <!-- bookmark items -->
  <g font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#495057">
    <g transform="translate(338, 100)">
      <rect x="-4" y="-8" width="78" height="16" rx="3" fill="rgba(26,77,140,0.10)"/>
      <text x="0" y="4">▾ m1 admin</text>
    </g>
    <text x="346" y="124">▸ 1.1 forms</text>
    <text x="346" y="142">▾ 1.3 quality</text>
    <text x="354" y="160">3.2.S drug subs</text>
    <text x="354" y="178">3.2.P drug prod</text>
    <text x="346" y="200">▸ 2.7 clinical</text>
    <text x="346" y="218">▸ 5.3 study reports</text>
  </g>

  <!-- batch indicator -->
  <g transform="translate(96, 304)">
    <rect x="0" y="0" width="288" height="32" rx="6" fill="#ffffff" stroke="#e9ecef"/>
    <rect x="8" y="12" width="180" height="8" rx="4" fill="#0aa67d"/>
    <rect x="188" y="12" width="92" height="8" rx="4" fill="#e9ecef"/>
    <text x="284" y="20" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#495057" text-anchor="end" dx="-12">62%</text>
  </g>
</svg>
