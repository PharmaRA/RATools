<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="word-illustration-title">
  <title id="word-illustration-title">RATools for Word — 文档撰写场景示意图</title>

  <!-- background -->
  <rect width="480" height="360" fill="#f8f9fa"/>

  <!-- ribbon at top of fake Word -->
  <rect x="60" y="48" width="360" height="36" rx="6" fill="#ffffff" stroke="#e9ecef"/>
  <rect x="74" y="60" width="44" height="12" rx="2" fill="#1a4d8c"/>
  <rect x="126" y="60" width="36" height="12" rx="2" fill="#dee2e6"/>
  <rect x="170" y="60" width="36" height="12" rx="2" fill="#dee2e6"/>
  <rect x="214" y="60" width="36" height="12" rx="2" fill="#dee2e6"/>
  <rect x="258" y="60" width="36" height="12" rx="2" fill="#dee2e6"/>
  <!-- RATools tab highlight -->
  <rect x="302" y="58" width="68" height="20" rx="3" fill="#1a4d8c"/>
  <text x="336" y="72" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">RATools</text>

  <!-- document body -->
  <rect x="60" y="92" width="360" height="232" rx="6" fill="#ffffff" stroke="#e9ecef"/>

  <!-- heading 1 -->
  <rect x="84" y="116" width="6" height="14" fill="#1a4d8c"/>
  <rect x="98" y="116" width="220" height="14" rx="2" fill="#212529"/>

  <!-- paragraph lines -->
  <rect x="84" y="146" width="312" height="6" rx="2" fill="#dee2e6"/>
  <rect x="84" y="160" width="296" height="6" rx="2" fill="#dee2e6"/>
  <rect x="84" y="174" width="240" height="6" rx="2" fill="#dee2e6"/>

  <!-- heading 2 -->
  <rect x="84" y="200" width="4" height="10" fill="#0aa67d"/>
  <rect x="94" y="200" width="160" height="10" rx="2" fill="#495057"/>

  <!-- paragraph lines -->
  <rect x="84" y="222" width="312" height="6" rx="2" fill="#dee2e6"/>
  <rect x="84" y="236" width="280" height="6" rx="2" fill="#dee2e6"/>

  <!-- field highlight (mock REF in blue) -->
  <rect x="84" y="258" width="60" height="10" rx="2" fill="rgba(26,77,140,0.16)"/>
  <rect x="86" y="260" width="56" height="6" rx="2" fill="#1a4d8c"/>
  <rect x="150" y="258" width="160" height="6" rx="2" fill="#dee2e6" y2="262"/>

  <!-- table indication -->
  <g stroke="#e9ecef" fill="none" stroke-width="1">
    <rect x="84" y="282" width="312" height="30"/>
    <line x1="84" y1="297" x2="396" y2="297"/>
    <line x1="180" y1="282" x2="180" y2="312"/>
    <line x1="276" y1="282" x2="276" y2="312"/>
  </g>
  <rect x="92" y="288" width="56" height="4" rx="1" fill="#1a4d8c"/>
  <rect x="188" y="288" width="56" height="4" rx="1" fill="#1a4d8c"/>
  <rect x="284" y="288" width="56" height="4" rx="1" fill="#1a4d8c"/>

  <!-- floating macro badge -->
  <g transform="translate(330, 224)">
    <rect x="0" y="0" width="76" height="32" rx="16" fill="#1a4d8c"/>
    <circle cx="16" cy="16" r="6" fill="#ffffff"/>
    <text x="44" y="20" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Macro</text>
  </g>
</svg>
