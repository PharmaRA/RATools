name: Deploy Portal & Manuals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: '发布门户与两份手册到 ratools.qzz.io（不勾选只构建校验）'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: portal-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.publish || false }}
  cancel-in-progress: false

jobs:
  build-word:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RATools-for-Word
        uses: actions/checkout@v4
        with:
          repository: PharmaRA/RATools-for-Word
          ref: main
          path: word-repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: word-repo/website/package-lock.json
      - name: Build RATools-for-Word manual
        working-directory: word-repo
        env:
          DOCS_SITE: https://ratools.qzz.io
          DOCS_BASE: /word
        run: |
          python -m pip install -r requirements-docs.txt
          npm --prefix website ci
          npm --prefix website run build
          python scripts/docs/check_docs.py --site-dir website/dist --base-path /word
      - uses: actions/upload-artifact@v4
        with:
          name: word-manual
          path: word-repo/website/dist
          if-no-files-found: error
          retention-days: 7

  build-pdf:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: pdf-repo/website
    steps:
      - name: Checkout RATools-for-PDF
        uses: actions/checkout@v4
        with:
          repository: PharmaRA/RATools-for-PDF
          ref: main
          path: pdf-repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked PDF site dependencies with recycle protection
        run: node scripts/install-deps.mjs
      - name: Check and build PDF manual for /pdf/
        run: npm run build:portal
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-manual
          path: pdf-repo/website/dist
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [build-word, build-pdf]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RATools portal
        uses: actions/checkout@v4
        with:
          path: portal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: word-manual
          path: word-site
      - uses: actions/download-artifact@v4
        with:
          name: pdf-manual
          path: pdf-site
      - name: Check portal manual buttons
        run: node portal/tests/manual-entry.test.js
      - name: Check assembly protections
        run: python -B portal/tests/site_assembly_test.py
      - name: Assemble site
        run: python -B portal/scripts/assemble_site.py --word-dist word-site --pdf-dist pdf-site --output portal/_site
      - name: Validate combined routes, assets, anchors and search
        run: python -B portal/scripts/check_site.py --site-dir portal/_site
      - name: Upload complete site for review
        uses: actions/upload-artifact@v4
        with:
          name: portal-preview
          path: portal/_site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Prepare Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
        uses: actions/upload-pages-artifact@v4
        with:
          path: portal/_site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
