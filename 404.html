<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 · RATools</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <style>
        .nf {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            gap: 8px;
        }
        .nf-code {
            font-family: var(--font-mono);
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1;
            margin: 0;
        }
        .nf-title { margin: 8px 0 4px; }
        .nf-text { color: var(--text-secondary); margin: 0 0 24px; }
    </style>
</head>
<body>
    <main class="nf">
        <p class="nf-code">404</p>
        <h1 class="nf-title" lang="zh-CN">页面走丢了</h1>
        <p class="nf-text">
            <span lang="zh-CN">没有找到这个页面。</span>
            <span lang="en">The page you’re looking for doesn’t exist.</span>
        </p>
        <a class="btn btn--primary" href="/">返回首页 · Back to home</a>
    </main>
</body>
</html>
